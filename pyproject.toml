[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omarbemo", email = "omarbassam813@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "arabic-reshaper>=3.0.1",
    "datasets>=5.0.1",
    "fastembed>=0.8.1",
    "groq<1.0.0",
    "langchain-groq>=1.1.3",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "python-bidi>=0.6.11",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "ragas>=0.4.3",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

